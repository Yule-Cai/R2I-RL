amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    initial_pose:
      x: -11.850000000000001
      y: -1.1999999999999993
      yaw: 0.0
      z: 0.0
    laser_model_type: likelihood_field
    map_topic: map
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    random_seed: 52703
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: scan
    set_initial_pose: true
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    use_sim_time: true
    z_hit: 0.5
    z_rand: 0.5
collision_monitor:
  ros__parameters:
    PolygonStop:
      action_type: stop
      enabled: true
      min_points: 4
      points: '[[0.35,0.30],[0.35,-0.30],[-0.30,-0.30],[-0.30,0.30]]'
      type: polygon
      visualize: false
    base_frame_id: base_footprint
    cmd_vel_in_topic: /cmd_vel_nav
    cmd_vel_out_topic: /cmd_vel
    enable_stamped_cmd_vel: true
    enabled: true
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - PolygonStop
    scan:
      enabled: true
      topic: /scan
      type: scan
    source_timeout: 0.5
    stop_pub_timeout: 2.0
    transform_tolerance: 0.3
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.2
      lookahead_dist: 0.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      rotate_to_heading_angular_vel: 0.5
      use_collision_detection: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    GoalChecker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.25
    PathHandler:
      plugin: nav2_controller::FeasiblePathHandler
      prune_distance: 2.0
    ProgressChecker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 1.0
    enable_stamped_cmd_vel: true
    failure_tolerance: 0.3
    goal_checker_plugins:
    - GoalChecker
    path_handler_plugins:
    - PathHandler
    progress_checker_plugins:
    - ProgressChecker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      filter_inflation:
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
        plugin: nav2_costmap_2d::InflationLayer
      filters:
      - keepout_filter
      - filter_inflation
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
        plugin: nav2_costmap_2d::InflationLayer
      keepout_filter:
        enabled: true
        filter_info_topic: /pilot/filter_info
        override_lethal_cost: false
        plugin: nav2_costmap_2d::KeepoutFilter
      obstacle_layer:
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.3
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      transform_tolerance: 0.3
      update_frequency: 10.0
      use_sim_time: true
lifecycle_manager_pilot:
  ros__parameters:
    autostart: false
    bond_timeout: 4.0
    node_names:
    - amcl
    - planner_server
    - controller_server
    - collision_monitor
    use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      filter_inflation:
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
        plugin: nav2_costmap_2d::InflationLayer
      filters:
      - keepout_filter
      - filter_inflation
      global_frame: map
      height: 6
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
        plugin: nav2_costmap_2d::InflationLayer
      keepout_filter:
        enabled: true
        filter_info_topic: /pilot/filter_info
        override_lethal_cost: false
        plugin: nav2_costmap_2d::KeepoutFilter
      obstacle_layer:
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.3
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      transform_tolerance: 0.3
      update_frequency: 10.0
      use_sim_time: true
      width: 6
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    use_sim_time: true
